<script>
const MEMBERS = ["Dagi","Sosi","Hassu"];
const st = {
  user: null,
  tab: "home",
  data: { members:{}, memories:[], timeline:[], jokes:[], votes:{}, quiz:[], scores:{Dagi:0,Sosi:0,Hassu:0}, activity:[], meta:{}, groupPhoto:null, describe:[] },
  ui: { lightbox:null, modal:null }
};

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  const d = Date.now()-ts, m=60000,h=3600000,day=86400000;
  if(d<m) return "just now";
  if(d<h) return Math.floor(d/m)+"m ago";
  if(d<day) return Math.floor(d/h)+"h ago";
  return Math.floor(d/day)+"d ago";
}
function fmtDate(str){
  if(!str) return "";
  const d = new Date(str+"T00:00:00");
  if(isNaN(d)) return str;
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}

// All app data lives in one Firestore collection ("kv"), doc ID = key.
// This keeps every existing call site (sGet/sSet/sList with "prefix:id" keys) working unchanged.
async function sGet(key, fallback){
  try{
    const snap = await db.collection('kv').doc(key).get();
    return snap.exists ? JSON.parse(snap.data().value) : fallback;
  }catch(e){ console.error("sGet failed", key, e); return fallback; }
}
async function sSet(key, val){
  try{
    await db.collection('kv').doc(key).set({ value: JSON.stringify(val), updated: firebase.firestore.FieldValue.serverTimestamp() });
  }catch(e){ console.error("storage set failed", key, e); }
}
async function sList(prefix){
  try{
    const end = prefix + '\uf8ff';
    const snap = await db.collection('kv')
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', end)
      .get();
    return snap.docs.map(d=>d.id);
  }catch(e){ console.error("sList failed", prefix, e); return []; }
}

async function logActivity(text){
  const id = uid();
  await sSet('activity:'+id, {text, ts: Date.now()});
  st.data.activity.unshift({text, ts:Date.now()});
  st.data.activity = st.data.activity.slice(0,60);
}

// No Firebase Storage on the free Spark plan, so photos are compressed hard
// and saved as base64 text directly inside the Firestore document. Firestore
// caps documents at 1MB, so maxW/quality are kept conservative on purpose —
// don't raise these much or big photos will fail to save.
function compressImage(file, maxW=700, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadAll(){
  const memberEntries = await Promise.all(MEMBERS.map(m => sGet('member:'+m, null)));
  MEMBERS.forEach((m,i)=>{ st.data.members[m] = memberEntries[i] || {bio:"",facts:"",favorites:"",photo:null}; });

  const scoreEntries = await Promise.all(MEMBERS.map(m => sGet('score:'+m, 0)));
  MEMBERS.forEach((m,i)=>{ st.data.scores[m] = scoreEntries[i] || 0; });

  const memKeys = await sList('memory:');
  st.data.memories = (await Promise.all(memKeys.map(k=>sGet(k,null)))).filter(Boolean).sort((a,b)=>b.ts-a.ts);

  const tlKeys = await sList('timeline:');
  st.data.timeline = (await Promise.all(tlKeys.map(k=>sGet(k,null)))).filter(Boolean).sort((a,b)=> (a.date||"").localeCompare(b.date||""));

  const jokeKeys = await sList('joke:');
  st.data.jokes = (await Promise.all(jokeKeys.map(k=>sGet(k,null)))).filter(Boolean).sort((a,b)=>b.ts-a.ts);

  const quizKeys = await sList('quiz:');
  st.data.quiz = (await Promise.all(quizKeys.map(k=>sGet(k,null)))).filter(Boolean).sort((a,b)=>b.ts-a.ts);

  const actKeys = await sList('activity:');
  const acts = (await Promise.all(actKeys.map(k=>sGet(k,null)))).filter(Boolean).sort((a,b)=>b.ts-a.ts);
  st.data.activity = acts.slice(0,60);

  const thisYear = new Date().getFullYear();
  const voteKeys = await sList('votes:'+thisYear+':');
  const voteEntries = (await Promise.all(voteKeys.map(k=>sGet(k,null)))).filter(Boolean);
  st.data.votes = {};
  voteEntries.forEach(v=>{ st.data.votes[v.name] = v.votes || {}; });

  st.data.meta.askerIdx = await sGet('meta:askerIdx', 0);
  st.data.meta.startDate = "2020-08-08";
  await sSet('meta:startDate', st.data.meta.startDate);
  st.data.groupPhoto = await sGet('meta:groupPhoto', null);

  const descKeys = await sList('describe:');
  st.data.describe = (await Promise.all(descKeys.map(k=>sGet(k,null)))).filter(Boolean);
}

function friendshipDuration(){
  const start = new Date(st.data.meta.startDate+"T00:00:00");
  const now = new Date();
  let years = now.getFullYear()-start.getFullYear();
  let months = now.getMonth()-start.getMonth();
  let days = now.getDate()-start.getDate();
  if(days<0){ months--; const prevMonth = new Date(now.getFullYear(), now.getMonth(),0); days += prevMonth.getDate(); }
  if(months<0){ years--; months += 12; }
  return {years,months,days};
}

const BG_SETS = {
  identity: ['✨','❤️','⭐','🫶'],
  home: ['❤️','⭐','✨','🫶','💫'],
  memories: ['📸','📷','❤️','🎉','✨'],
  play: ['🎮','❓','😂','🤣','🎲'],
  timeline: ['⭐','⏳','📍','🎵','✨'],
  describe: ['💬','🫶','✨','❤️'],
  jokes: ['🤣','😂','💬','🎉'],
  awards: ['🏆','⭐','🎉','🔥','✨']
};
let lastBgKey = null;
function buildBgFx(key){
  const set = BG_SETS[key] || BG_SETS.home;
  const count = window.innerWidth < 640 ? 10 : 16;
  let html = '';
  for(let i=0;i<count;i++){
    const emoji = set[Math.floor(Math.random()*set.length)];
    const layer = ['far','mid','near'][Math.floor(Math.random()*3)];
    const size = layer==='near' ? (24+Math.random()*10) : layer==='mid' ? (17+Math.random()*7) : (11+Math.random()*6);
    const opA = layer==='near' ? 0.16 : layer==='mid' ? 0.12 : 0.08;
    const opB = opA + 0.09;
    const left = Math.random()*100;
    const top = Math.random()*100;
    const dur = 16 + Math.random()*16;
    const delay = -Math.random()*dur;
    const dx = (Math.random()*36-18).toFixed(0);
    const dy = (Math.random()*44+16) * (Math.random()<0.5?1:-1);
    const rot = (Math.random()*24-12).toFixed(0);
    html += `<span class="bgfx-item layer-${layer}" style="left:${left}%;top:${top}%;font-size:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;--dx:${dx}px;--dy:${dy.toFixed(0)}px;--rot:${rot}deg;--op-a:${opA};--op-b:${opB};">${emoji}</span>`;
  }
  return html;
}
function updateBgFx(){
  const key = st.user ? st.tab : 'identity';
  if(key === lastBgKey) return;
  lastBgKey = key;
  const el = document.getElementById('bgfx');
  if(el) el.innerHTML = buildBgFx(key);
}

function render(){
  updateBgFx();
  const root = document.getElementById('root');
  if(!st.user){ root.innerHTML = renderIdentityScreen(); attachIdentityEvents(); return; }
  root.innerHTML = renderTopbar() + '<div id="app">' + renderTab() + '</div>' + renderFab() + renderModal() + renderLightbox();
  attachGlobalEvents();
}

function attachIdentityEvents(){
  document.querySelectorAll('.id-btn').forEach(b=>{
    b.onclick = async ()=>{ st.user = b.dataset.user; await loadAll(); render(); startPolling(); };
  });
  document.querySelectorAll('[data-id-photo]').forEach(input=>{
    input.onchange = async (e)=>{
      const m = input.dataset.idPhoto;
      const f = e.target.files[0]; if(!f) return;
      const photo = await compressImage(f, 400, 0.75);
      const existing = st.data.members[m] || {bio:"",facts:"",favorites:"",photo:null};
      existing.photo = photo;
      st.data.members[m] = existing;
      await sSet('member:'+m, existing);
      render();
    };
  });
}

        }).join('')}

  </div>`;
}

function otherPlayers(asker){ return MEMBERS.filter(m=>m!==asker); }
function isJudgedComplete(q){
  const others = otherPlayers(q.questioner);
  return others.every(p => q.judged && (q.judged[p]===true || q.judged[p]===false));
}
function renderQuizCard(q){
  const others = otherPlayers(q.questioner);
  const isAsker = st.user===q.questioner;
  const iAnswered = q.answers && q.answers[st.user];
  let body = `<div class="qcard"><div class="qmeta">${q.questioner} asks</div><div class="qtext">${esc(q.question)}</div>`;
  if(!isAsker){
    if(iAnswered){
      body += `<div style="color:var(--muted);font-size:13px;">You answered: <b style="color:var(--cream);">${esc(iAnswered.text)}</b>. Waiting for ${q.questioner} to judge.</div>`;
    } else if(q.type==='mc' || q.type==='thisorthat'){
      body += (q.options||[]).map(o=>`<button class="opt-btn" data-answer-quiz="${q.id}" data-answer-text="${esc(o)}">${esc(o)}</button>`).join('');
    } else {
      body += `<div class="form-row"><input type="text" id="freeans-${q.id}" placeholder="Type your answer"></div><button class="btn primary small" data-answer-free="${q.id}">Submit answer</button>`;
    }
  } else {
    body += `<div style="color:var(--muted);font-size:12.5px;margin-bottom:10px;">Correct answer: <b style="color:var(--gold-hi);">${esc(q.correct)}</b></div>`;
    others.forEach(p=>{
      const ans = q.answers && q.answers[p];
      body += `<div class="answer-row"><span><b>${p}:</b> ${ans?esc(ans.text):'<i style="color:var(--muted-2)">waiting...</i>'}</span>`;
      if(ans){
        const judged = q.judged && q.judged[p];
        body += `<span class="judge-btns"><button class="yes ${judged===true?'on':''}" data-judge="${q.id}" data-player="${p}" data-verdict="true">Correct</button><button class="no ${judged===false?'on':''}" data-judge="${q.id}" data-player="${p}" data-verdict="false">Wrong</button></span></div>`;
      } else body += `</div>`;
    });
  }
  body += `</div>`;
  return body;
}

function slug(s){ return (s||'').replace(/[^\w]+/g,'-').replace(/^-+|-+$/g,'') || 'award'; }
function tallyVotes(votes){
  const counts = {}; MEMBERS.forEach(m=>counts[m]=0);
  Object.values(votes||{}).forEach(v=>{ if(v && counts.hasOwnProperty(v)) counts[v]++; });
  return counts;
}
function computeAwardResult(votes){
  const counts = tallyVotes(votes);
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const top = entries[0];
  const votesIn = Object.keys(votes||{}).length;
  if(!top || top[1]===0) return {status:'none', votesIn};
  const tiedWithTop = entries.filter(e=>e[1]===top[1]);
  if(tiedWithTop.length>1) return {status:'tie', names:tiedWithTop.map(e=>e[0]), votesIn};
  return {status: votesIn>=3 ? 'final' : 'leading', winner: top[0], votesIn};
}

function renderAwards(){
  const year = new Date().getFullYear();
  const defaults = ["🏆 Funniest","💀 Most Chaotic","🗣️ Biggest Yapper","🧠 Smartest","😴 Sleepiest","⏰ Most Likely to Be Late","🤡 Biggest Clown","🫡 Most Reliable","🕵️ Most Secretive","📱 Most Addicted to Their Phone","🍔 Biggest Food Lover","😎 Most Confident","🧨 Most Likely to Start an Argument","❤️ Most Caring","🤣 Best Storyteller","🎭 Best Actor","😂 Most Likely to Do Something Stupid","🔥 Most Energetic","🙃 Most Unpredictable"];
  const customNames = Object.keys(st.data.votes || {}).filter(n=>!defaults.includes(n));
  const allNames = Array.from(new Set([...defaults, ...customNames]));
  const {years} = friendshipDuration();
  return `
  <div class="section" style="padding-top:20px;">
    <div class="eyebrow">${year} awards</div>
    <h2>Friendship awards & stats</h2>
    <p class="sub">All three of you vote. Whoever gets the most votes takes the title — updates live as votes come in.</p>
    <div class="card" style="margin-bottom:26px;">
      ${allNames.map(name=>{
        const votes = (st.data.votes && st.data.votes[name]) || {};
        const myVote = votes[st.user];
        const result = computeAwardResult(votes);
        let resultLabel = '';
        if(result.status==='none') resultLabel = `<span style="color:var(--muted-2);">No votes yet</span>`;
        else if(result.status==='tie') resultLabel = `<span style="color:var(--gold-hi);">Tied: ${result.names.join(' & ')}</span>`;
        else if(result.status==='leading') resultLabel = `<span style="color:var(--muted);">${esc(result.winner)} leading (${result.votesIn}/3 voted)</span>`;
        else if(result.status==='final') resultLabel = `<span class="award-winner">🏆 ${esc(result.winner)}</span>`;
        return `
        <div class="award-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
            <span class="award-name">${esc(name)}</span>
            ${resultLabel}
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${MEMBERS.map(m=>`<button class="pill vote-btn ${myVote===m?'active':''}" data-vote-award="${esc(name)}" data-vote-for="${m}">${myVote===m?'✓ ':''}${m}</button>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    <button class="btn small" style="margin-bottom:30px;" data-action="addCustomAward">Add custom award</button>

    <div class="eyebrow">The numbers</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${years}</div><div class="stat-lbl">Years as friends</div></div>
      <div class="stat-card"><div class="stat-num">${st.data.memories.length}</div><div class="stat-lbl">Photos</div></div>
      <div class="stat-card"><div class="stat-num">${st.data.quiz.length}</div><div class="stat-lbl">Questions played</div></div>
      <div class="stat-card"><div class="stat-num">${MEMBERS.reduce((a,m)=>a+Math.max(st.data.scores[m],0),0)}</div><div class="stat-lbl">Points won</div></div>
    </div>
  </div>`;
}

  <div class="form-row"><label>Place (add whenever you remember)</label><input type="text" id="memPlace" placeholder="Optional"></div>
  <div class="form-row"><label>Date (add whenever you remember)</label><input type="date" id="memDate"></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveMemory">Save memory</button></div>`;
}
function timelineModalContent(){
  return `
  <h3>Add a chapter to our story</h3>
  <div class="form-row"><label>Title</label><input type="text" id="tlTitle" placeholder="e.g. High school"></div>
  <div class="form-row"><label>Date</label><input type="date" id="tlDate"></div>
  <div class="form-row"><label>Location</label><input type="text" id="tlLocation" placeholder="Optional"></div>
  <div class="form-row"><label>Description</label><textarea id="tlDesc" placeholder="What happened?"></textarea></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveTimeline">Save</button></div>`;
}
function jokeModalContent(){
  return `
  <h3>Log an inside joke</h3>
  <div class="form-row"><label>Title</label><input type="text" id="jkTitle" placeholder="e.g. The Sosi Incident™"></div>
  <div class="form-row"><label>Date</label><input type="date" id="jkDate"></div>
  <div class="form-row"><label>The story</label><textarea id="jkStory" placeholder="Tell it properly"></textarea></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveJoke">Save</button></div>`;
}
function quizModalContent(){
  return `
  <h3>Create a question about yourself</h3>
  <div class="form-row"><label>Question type</label><select id="qzType"><option value="mc">Multiple choice</option><option value="written">Written answer</option><option value="thisorthat">This or that</option></select></div>
  <div class="form-row"><label>Question</label><input type="text" id="qzQuestion" placeholder="e.g. What's my dream destination?"></div>
  <div class="form-row"><label>Options (comma separated, for multiple choice / this-or-that)</label><input type="text" id="qzOptions" placeholder="Japan, France, Italy"></div>
  <div class="form-row"><label>Correct answer</label><input type="text" id="qzCorrect" placeholder="The real answer, exactly"></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveQuiz">Ask the family</button></div>`;
}
function customAwardModalContent(){
  return `
  <h3>Add a custom award</h3>
  <div class="form-row"><label>Award name</label><input type="text" id="awName" placeholder="e.g. Best cook"></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveCustomAward">Add award</button></div>`;
}
function describeModalContent(){
  const others = MEMBERS.filter(m=>m!==st.user);
  const existing = {};
  others.forEach(o=>{ const e = st.data.describe.find(d=>d.subject===o && d.author===st.user); if(e) existing[o]=e.text; });
  return `
  <h3>Describe a friend</h3>
  <div class="form-row"><label>Who are you describing?</label>
    <select id="dsSubject">${others.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>
  </div>
  <div class="form-row"><label>In your own words</label><textarea id="dsText" placeholder="What makes them, them?"></textarea></div>
  <div class="modal-actions"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveDescribe">Save</button></div>`;
}
let pendingPhoto = null;


function attachGlobalEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{ el.onclick = ()=>{ st.tab = el.dataset.tab; st.ui.lightbox=null; render(); }; });
  const sw = document.getElementById('switchUser');
  if(sw) sw.onclick = ()=>{ st.user=null; render(); };
  const fab = document.getElementById('fabBtn');
  if(fab) fab.onclick = ()=> handleAction(fab.dataset.action);
  document.querySelectorAll('[data-action]').forEach(el=>{ if(el.id==='fabBtn') return; el.onclick = ()=> handleAction(el.dataset.action, el); });
  document.querySelectorAll('[data-lightbox]').forEach(el=>{ el.onclick = ()=>{ st.ui.lightbox = el.dataset.lightbox; render(); }; });
  const lbClose = document.getElementById('lightboxClose');
  const lbOverlay = document.getElementById('lightboxOverlay');
  if(lbClose) lbClose.onclick = ()=>{ st.ui.lightbox=null; render(); };
  if(lbOverlay) lbOverlay.onclick = (e)=>{ if(e.target===lbOverlay){ st.ui.lightbox=null; render(); } };
  const backdrop = document.getElementById('modalBackdrop');
  if(backdrop) backdrop.onclick = (e)=>{ if(e.target===backdrop){ st.ui.modal=null; render(); } };

  const memPick = document.getElementById('memPhotoPick');
  if(memPick){
    memPick.onclick = ()=> document.getElementById('memPhotoInput').click();
    document.getElementById('memPhotoInput').onchange = async (e)=>{
      const f = e.target.files[0]; if(!f) return;
      document.getElementById('memPhotoLabel').textContent = 'Compressing...';
      pendingPhoto = await compressImage(f);
      memPick.innerHTML = `<img src="${pendingPhoto}"><div style="font-size:11px;margin-top:6px;">Tap to change</div>`;
      memPick.onclick = ()=> document.getElementById('memPhotoInput').click();
    };
  }
  const groupPick = document.getElementById('groupPhotoPick');
  if(groupPick){
    groupPick.onclick = ()=> document.getElementById('groupPhotoInput').click();
    document.getElementById('groupPhotoInput').onchange = async (e)=>{
      const f = e.target.files[0]; if(!f) return;
      const photo = await compressImage(f, 1000, 0.75);
      await sSet('meta:groupPhoto', photo);
      st.data.groupPhoto = photo;
      await logActivity(`📸 ${st.user} set the main group photo`);
      render();
    };
  }

  document.querySelectorAll('[data-answer-quiz]').forEach(el=>{ el.onclick = ()=> submitQuizAnswer(el.dataset.answerQuiz, el.dataset.answerText); });
  document.querySelectorAll('[data-answer-free]').forEach(el=>{ el.onclick = ()=>{ const id = el.dataset.answerFree; const val = document.getElementById('freeans-'+id).value.trim(); if(val) submitQuizAnswer(id, val); }; });
  document.querySelectorAll('[data-judge]').forEach(el=>{ el.onclick = ()=> judgeAnswer(el.dataset.judge, el.dataset.player, el.dataset.verdict==='true'); });
  document.querySelectorAll('[data-vote-award]').forEach(el=>{ el.onclick = ()=> voteAward(el.dataset.voteAward, el.dataset.voteFor); });
}

async function handleAction(action){
  if(action==='closeModal'){ st.ui.modal=null; pendingPhoto=null; render(); return; }
  if(action==='openMemoryModal'){ st.ui.modal='memory'; pendingPhoto=null; render(); return; }
  if(action==='openTimelineModal'){ st.ui.modal='timeline'; render(); return; }
  if(action==='openJokeModal'){ st.ui.modal='joke'; render(); return; }
  if(action==='openQuizModal'){ st.ui.modal='quiz'; render(); return; }
  if(action==='addCustomAward'){ st.ui.modal='customAward'; render(); return; }
  if(action==='openDescribeModal'){ st.ui.modal='describe'; render(); return; }

  if(action==='saveMemory') return saveMemory();
  if(action==='saveTimeline') return saveTimeline();
  if(action==='saveJoke') return saveJoke();
  if(action==='saveQuiz') return saveQuiz();
  if(action==='saveCustomAward') return saveCustomAward();
  if(action==='saveDescribe') return saveDescribe();
}

async function saveMemory(){
  if(!pendingPhoto){ alert('Choose a photo first'); return; }
  const id = uid();
  const videoLink = document.getElementById('memVideoLink').value.trim();
  const mem = { id, video: videoLink || null, place: document.getElementById('memPlace').value, caption: document.getElementById('memCaption').value, date: document.getElementById('memDate').value, description: document.getElementById('memDesc').value, photo: pendingPhoto, by: st.user, ts: Date.now() };
  await sSet('memory:'+id, mem);
  st.data.memories.unshift(mem);
  await logActivity(`📸 ${st.user} added a new memory`);
  pendingPhoto=null; st.ui.modal=null; st.tab='memories'; render();
}
async function saveTimeline(){
  const title = document.getElementById('tlTitle').value.trim();
  if(!title){ alert('Add a title'); return; }
  const id = uid();
  const item = { id, title, date: document.getElementById('tlDate').value, location: document.getElementById('tlLocation').value, description: document.getElementById('tlDesc').value, by: st.user, ts: Date.now() };
  await sSet('timeline:'+id, item);
  st.data.timeline.push(item);
  st.data.timeline.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  await logActivity(`🕰️ ${st.user} added "${title}" to the story`);
  st.ui.modal=null; render();
}
async function saveJoke(){
  const title = document.getElementById('jkTitle').value.trim();
  if(!title){ alert('Add a title'); return; }
  const id = uid();
  const item = { id, title, date: document.getElementById('jkDate').value, story: document.getElementById('jkStory').value, by: st.user, ts: Date.now() };
  await sSet('joke:'+id, item);
  st.data.jokes.unshift(item);
  await logActivity(`😂 ${st.user} added an inside joke`);
  st.ui.modal=null; render();
}
async function saveQuiz(){
  const type = document.getElementById('qzType').value;
  const question = document.getElementById('qzQuestion').value.trim();
  const correct = document.getElementById('qzCorrect').value.trim();
  if(!question || !correct){ alert('Fill in the question and correct answer'); return; }
  let options = [];
  if(type==='mc' || type==='thisorthat'){
    options = document.getElementById('qzOptions').value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!options.includes(correct)) options.push(correct);
  }
  const id = uid();
  const q = { id, questioner: st.user, type, question, options, correct, answers:{}, judged:{}, ts: Date.now() };
  await sSet('quiz:'+id, q);
  st.data.quiz.unshift(q);
  const idx = (st.data.meta.askerIdx + 1) % 3;
  st.data.meta.askerIdx = idx;
  await sSet('meta:askerIdx', idx);
  await logActivity(`🎮 ${st.user} asked a new question`);
  st.ui.modal=null; st.tab='play'; render();
}
async function saveCustomAward(){
  const name = document.getElementById('awName').value.trim();
  if(!name) return;
  st.data.votes = st.data.votes || {};
  st.data.votes[name] = st.data.votes[name] || {};
  await sSet('votes:'+new Date().getFullYear()+':'+slug(name), {name, votes: st.data.votes[name]});
  await logActivity(`🏆 ${st.user} added a custom award: "${name}"`);
  st.ui.modal=null; render();
}
async function voteAward(name, choice){
  st.data.votes = st.data.votes || {};
  st.data.votes[name] = st.data.votes[name] || {};
  st.data.votes[name][st.user] = choice;
  await sSet('votes:'+new Date().getFullYear()+':'+slug(name), {name, votes: st.data.votes[name]});
  await logActivity(`🗳️ ${st.user} voted for "${name}"`);
  render();
}
async function saveDescribe(){
  const subject = document.getElementById('dsSubject').value;
  const text = document.getElementById('dsText').value.trim();
  if(!text){ alert('Write something first'); return; }
  const key = 'describe:'+subject+':'+st.user;
  const item = { subject, author: st.user, text, ts: Date.now() };
  await sSet(key, item);
  st.data.describe = st.data.describe.filter(d=>!(d.subject===subject && d.author===st.user));
  st.data.describe.push(item);
  await logActivity(`✏️ ${st.user} wrote about ${subject}`);
  st.ui.modal=null; render();
}
async function submitQuizAnswer(qid, text){
  const q = st.data.quiz.find(x=>x.id===qid);
  if(!q) return;
  q.answers = q.answers || {};
  q.answers[st.user] = { text, ts: Date.now() };
  await sSet('quiz:'+qid, q);
  await logActivity(`🎮 ${st.user} answered ${q.questioner}'s question`);
  render();
}
async function judgeAnswer(qid, player, correct){
  const q = st.data.quiz.find(x=>x.id===qid);
  if(!q) return;
  const already = q.judged && (player in q.judged);
  q.judged = q.judged || {};
  const prevVerdict = q.judged[player];
  q.judged[player] = correct;
  await sSet('quiz:'+qid, q);
  let delta = 0;
  if(!already){ delta = correct ? 1 : -1; }
  else if(prevVerdict !== correct){ delta = correct ? 2 : -2; }
  if(delta !== 0){
    st.data.scores[player] = (st.data.scores[player]||0) + delta;
    await sSet('score:'+player, st.data.scores[player]);
    await logActivity(`🎮 ${q.questioner} judged ${player} ${correct?'correct':'wrong'}`);
  }
  render();
}

let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    if(!st.user || st.ui.modal) return;
    await loadAll();
    render();
  }, 6000);
}

loadAll().then(()=>{ if(st.user){ startPolling(); } render(); });
render();
</script>
